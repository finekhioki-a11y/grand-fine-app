  </button>

  <script>
    // サービスワーカー登録（Chromeに「アプリインストール」を認識させる必須設定）
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }

    let deferredPrompt = null;
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

    const modal = document.getElementById('installModal');
    const buttonGroup = document.getElementById('buttonGroup');
    const guideArea = document.getElementById('guideArea');
    const guideText = document.getElementById('guideText');
    const btnOpenModal = document.getElementById('btnOpenModal');

    // すでにアプリとして起動しているときは非表示
    if (isStandalone) {
      modal.style.display = 'none';
      btnOpenModal.style.display = 'none';
    }

    // Chrome用：インストール可能イベントを受け取る
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    // 1.「アプリをインストール」を押したとき
    document.getElementById('btnInstallApp').addEventListener('click', async () => {
      if (deferredPrompt) {
        // Android Chrome: 直接OSの「アプリをインストールしますか？」を起動
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          modal.style.display = 'none';
        }
        deferredPrompt = null;
      } else if (isIOS) {
        if (navigator.share) {
          try {
            await navigator.share({
              title: document.title,
              url: window.location.href
            });
          } catch (err) {}
        }
        showGuide("iPhoneでのアプリ化手順", "画面下の共有メニューから【ホーム画面に追加】を選ぶと、アドレスバーが消えて本物のアプリとして起動します！");
      } else {
        showGuide("インストール手順", "ブラウザ右上のメニュー（︙）に【アプリをインストール】が表示されます。そちらをタップしてください。");
      }
    });

    // 2.「ショートカットを追加」を押したとき
    document.getElementById('btnShortcut').addEventListener('click', () => {
      if (isIOS) {
        showGuide("ショートカット追加手順", "画面下の共有メニュー（四角から上矢印マーク）を開き、【ホーム画面に追加】をタップしてください。");
      } else {
        showGuide("ショートカット追加手順", "ブラウザ右上のメニュー（︙）を開き、【ホーム画面に追加】をタップしてください。");
      }
    });
