<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>グランドファイン豊中</title>
  
  <!-- PWA・フルスクリーン設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="グランドファイン豊中">

  <link rel="manifest" href="manifest.json?v=1">
  <link rel="apple-touch-icon" href="toyonaka.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-image: url('gf-toyonakaminami_main_01.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      min-height: 100vh;
    }
  </style>
</head>
<body class="p-4 flex items-center justify-center min-h-screen relative">

  <!-- メインコンテンツ -->
  <div class="bg-white/85 p-6 rounded-3xl shadow-2xl w-full max-w-lg text-center backdrop-blur-sm">
    <img src="gftoyonaka_w.jpg" alt="グランドファイン豊中" class="mx-auto h-12 mb-4">
    <h1 class="text-lg font-bold text-gray-800 mb-6">メニューを選択</h1>
    <div class="grid grid-cols-2 gap-4">
      <a href="https://www.hotel-fine.co.jp/hotel/gf-toyonakaminami/" class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 hover:bg-gray-50 transition">
        <div class="text-4xl mb-2">🏠</div>
        <div class="font-bold text-gray-700">公式HP</div>
      </a>
      <a href="rooms.html" class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 hover:bg-gray-50 transition">
        <div class="text-4xl mb-2">🛋️</div>
        <div class="font-bold text-gray-700">お部屋・設備案内</div>
      </a>
    </div>
  </div>

  <!-- ★ アプリ追加・インストール選択ポップアップ ★ -->
  <div id="installModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-end sm:items-center justify-center z-50 p-4 transition-opacity duration-300">
    <div class="bg-white w-full max-w-md rounded-3xl p-6 shadow-2xl text-center transform transition-all">
      
      <!-- アプリアイコンとタイトル -->
      <img src="toyonaka.png" alt="App Icon" class="w-16 h-16 mx-auto rounded-2xl shadow-md mb-3 object-cover border border-gray-100">
      <h2 class="text-xl font-bold text-gray-900 mb-1">グランドファイン豊中</h2>
      <p class="text-xs text-gray-500 mb-5">ご利用方法をお選びください</p>

      <!-- 2つの選択肢 -->
      <div class="space-y-3 mb-5">
        
        <!-- 選択肢1：インストールする（本物のアプリ化） -->
        <button id="btnInstallApp" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white p-4 rounded-2xl text-left shadow-lg shadow-blue-500/25 transition flex items-center justify-between">
          <div class="flex items-center space-x-3">
            <span class="text-2xl">📱</span>
            <div>
              <div class="font-bold text-sm flex items-center gap-1.5">
                アプリをインストール
                <span class="bg-white/20 text-white text-[10px] px-2 py-0.5 rounded-full font-normal">推奨</span>
              </div>
              <div class="text-xs text-blue-100 font-light mt-0.5">全画面起動・バー非表示でアプリ化</div>
            </div>
          </div>
          <span class="text-blue-200 text-lg">›</span>
        </button>

        <!-- 選択肢2：ショートカットを追加 -->
        <button id="btnShortcut" class="w-full bg-gray-50 hover:bg-gray-100 border border-gray-200 text-gray-800 p-4 rounded-2xl text-left transition flex items-center justify-between">
          <div class="flex items-center space-x-3">
            <span class="text-2xl">🔗</span>
            <div>
              <div class="font-bold text-sm">ホーム画面に追加（ショートカット）</div>
              <div class="text-xs text-gray-500 font-light mt-0.5">ブラウザのブックマーク感覚で追加</div>
            </div>
          </div>
          <span class="text-gray-400 text-lg">›</span>
        </button>

      </div>

      <!-- 閉じるボタン -->
      <button id="btnCloseModal" class="text-xs text-gray-400 hover:text-gray-600 font-medium py-1">
        今はブラウザのまま使う
      </button>

      <!-- iOS専用の手順案内ガイド（初期非表示） -->
      <div id="iosGuide" class="hidden mt-4 pt-4 border-t border-gray-100 text-left bg-blue-50/70 p-4 rounded-2xl">
        <p class="text-xs font-bold text-blue-900 mb-2 flex items-center gap-1">
          <span>ℹ️</span> iPhoneでの追加手順
        </p>
        <ol class="text-xs text-blue-800 space-y-1 list-decimal list-inside leading-relaxed">
          <li>画面下の <span class="font-bold bg-white px-1.5 py-0.5 rounded border shadow-sm">共有ボタン（四角から上矢印）</span> をタップ</li>
          <li>メニューを下にスクロールして <span class="font-bold bg-white px-1.5 py-0.5 rounded border shadow-sm">ホーム画面に追加</span> を選択</li>
          <li>右上の「追加」を押すと完了です</li>
        </ol>
      </div>

    </div>
  </div>

  <!-- ポップアップを開くための常駐ボタン（右下） -->
  <button id="btnOpenModal" class="fixed bottom-5 right-5 bg-white/95 backdrop-blur text-gray-800 px-4 py-2.5 rounded-full shadow-xl text-xs font-bold flex items-center gap-2 border border-gray-200 hover:scale-105 active:scale-95 transition z-40">
    <span>📲</span> アプリ追加
  </button>

  <script>
    let deferredPrompt = null;
    const modal = document.getElementById('installModal');
    const btnOpenModal = document.getElementById('btnOpenModal');
    const btnCloseModal = document.getElementById('btnCloseModal');
    const btnInstallApp = document.getElementById('btnInstallApp');
    const btnShortcut = document.getElementById('btnShortcut');
    const iosGuide = document.getElementById('iosGuide');

    // すでにインストールされたスタンドアロン環境で起動している場合は非表示
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    if (isStandalone) {
      modal.classList.add('hidden');
      btnOpenModal.classList.add('hidden');
    }

    // Android/PC の PWA インストールプロンプト待機
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    // 「アプリをインストール」ボタンを押したとき
    btnInstallApp.addEventListener('click', async () => {
      if (deferredPrompt) {
        // Android / Chrome: システム標準のインストール確認を出す
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        deferredPrompt = null;
        if (outcome === 'accepted') {
          modal.classList.add('hidden');
        }
      } else {
        // iPhone または 直接プロンプトが出せない場合：手順ガイドを表示
        iosGuide.classList.remove('hidden');
      }
    });

    // 「ショートカットを追加」ボタンを押したとき
    btnShortcut.addEventListener('click', () => {
      iosGuide.classList.remove('hidden');
    });

    // 閉じるボタン
    btnCloseModal.addEventListener('click', () => {
      modal.classList.add('hidden');
    });

    // 右下の常駐ボタンを押したら再表示
    btnOpenModal.addEventListener('click', () => {
      iosGuide.classList.add('hidden');
      modal.classList.remove('hidden');
    });
  </script>
</body>
</html>
