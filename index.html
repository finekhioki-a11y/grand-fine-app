<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>グランドファイン豊中</title>
  
  <!-- フルスクリーン・PWA設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="グランドファイン豊中">

  <link rel="manifest" href="manifest.json?v=2">
  <link rel="apple-touch-icon" href="toyonaka.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-image: url('gf-toyonakaminami_main_01.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      min-height: 100vh;
    }
  </style>
</head>
<body class="p-4 flex items-center justify-center min-h-screen relative">

  <!-- メイン画面 -->
  <div class="bg-white/85 p-6 rounded-3xl shadow-2xl w-full max-w-lg text-center backdrop-blur-sm">
    <img src="gftoyonaka_w.jpg" alt="グランドファイン豊中" class="mx-auto h-12 mb-4">
    <h1 class="text-lg font-bold text-gray-800 mb-6">メニューを選択</h1>
    <div class="grid grid-cols-2 gap-4">
      <a href="https://www.hotel-fine.co.jp/hotel/gf-toyonakaminami/" class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 hover:bg-gray-50 transition">
        <div class="text-4xl mb-2">🏠</div>
        <div class="font-bold text-gray-700">公式HP</div>
      </a>
      <a href="rooms.html" class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 hover:bg-gray-50 transition">
        <div class="text-4xl mb-2">🛋️</div>
        <div class="font-bold text-gray-700">お部屋・設備案内</div>
      </a>
    </div>
  </div>

  <!-- ★ ポップアップ ★ -->
  <div id="installModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-end sm:items-center justify-center z-50 p-4">
    <div class="bg-white w-full max-w-md rounded-3xl p-6 shadow-2xl text-center">
      
      <img src="toyonaka.png" alt="App Icon" class="w-16 h-16 mx-auto rounded-2xl shadow-md mb-3 object-cover border border-gray-100">
      <h2 class="text-xl font-bold text-gray-900 mb-1">グランドファイン豊中</h2>
      <p class="text-xs text-gray-500 mb-5">ご利用方法をお選びください</p>

      <!-- ボタン一覧 -->
      <div id="buttonGroup" class="space-y-3 mb-5">
        
        <!-- 選択肢1：インストール -->
        <button onclick="onInstallClick()" type="button" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 active:scale-95 text-white p-4 rounded-2xl text-left shadow-lg shadow-blue-500/25 flex items-center justify-between transition cursor-pointer">
          <div class="flex items-center space-x-3">
            <span class="text-2xl">📱</span>
            <div>
              <div class="font-bold text-sm flex items-center gap-1.5">
                アプリをインストール
                <span class="bg-white/20 text-white text-[10px] px-2 py-0.5 rounded-full font-normal">推奨</span>
              </div>
              <div class="text-xs text-blue-100 font-light mt-0.5">全画面起動・バー非表示でアプリ化</div>
            </div>
          </div>
          <span class="text-blue-200 text-lg">›</span>
        </button>

        <!-- 選択肢2：ショートカット -->
        <button onclick="onShortcutClick()" type="button" class="w-full bg-gray-50 active:scale-95 border border-gray-200 text-gray-800 p-4 rounded-2xl text-left flex items-center justify-between transition cursor-pointer">
          <div class="flex items-center space-x-3">
            <span class="text-2xl">🔗</span>
            <div>
              <div class="font-bold text-sm">ホーム画面に追加（ショートカット）</div>
              <div class="text-xs text-gray-500 font-light mt-0.5">ブラウザのブックマーク感覚で追加</div>
            </div>
          </div>
          <span class="text-gray-400 text-lg">›</span>
        </button>

      </div>

      <!-- 手順案内（ボタンを押したときに確実に表示） -->
      <div id="guideArea" style="display: none;" class="mb-5 text-left bg-blue-50 p-4 rounded-2xl border border-blue-100">
        <p id="guideTitle" class="text-xs font-bold text-blue-900 mb-2">📲 追加手順</p>
        <div id="guideBody" class="text-xs text-blue-800 leading-relaxed space-y-1"></div>
        <button onclick="backToChoices()" type="button" class="mt-3 text-xs text-blue-600 font-bold underline">
          ← 選択肢に戻る
        </button>
      </div>

      <!-- 閉じるボタン -->
      <button onclick="closeModal()" type="button" class="text-xs text-gray-400 hover:text-gray-600 font-medium py-1">
        今はブラウザのまま使う
      </button>

    </div>
  </div>

  <!-- 右下の常駐ボタン -->
  <button onclick="openModal()" id="btnOpenModal" type="button" class="fixed bottom-5 right-5 bg-white/95 text-gray-800 px-4 py-2.5 rounded-full shadow-xl text-xs font-bold flex items-center gap-2 border border-gray-200 z-40">
    <span>📲</span> アプリ追加
  </button>

  <script>
    // サービスワーカー登録
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(function(e) {});
    }

    var deferredPrompt = null;
    var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

    // スタンドアロン起動時は非表示
    if (isStandalone) {
      document.getElementById('installModal').style.display = 'none';
      document.getElementById('btnOpenModal').style.display = 'none';
    }

    // Chromeのインストール可能イベント
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      deferredPrompt = e;
    });

    // 「アプリをインストール」を押したとき
    function onInstallClick() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function(choice) {
          if (choice.outcome === 'accepted') {
            closeModal();
          }
          deferredPrompt = null;
        });
      } else if (isIOS) {
        if (navigator.share) {
          navigator.share({ title: document.title, url: window.location.href }).catch(function() {});
        }
        showGuide("iPhoneでのアプリ化手順", [
          "1. 画面下の共有ボタン（四角から上矢印）をタップ",
          "2. メニューから【ホーム画面に追加】を選択",
          "3. アドレスバーが消えて本物のアプリとして動きます！"
        ]);
      } else {
        // Android Chromeのプロンプト待機時または通常案内
        showGuide("Androidでのインストール手順", [
          "1. Chrome右上のメニュー【︙】をタップ",
          "2. 【ホーム画面に追加】または【アプリをインストール】を選択",
          "3. 表示される確認画面で【インストール】をタップしてください！"
        ]);
      }
    }

    // 「ショートカットを追加」を押したとき
    function onShortcutClick() {
      showGuide("ショートカット追加手順", [
        "1. ブラウザのメニュー（Chromeは右上【︙】、iPhoneは画面下【共有】）を開く",
        "2. 【ホーム画面に追加】をタップしてください"
      ]);
    }

    function showGuide(title, steps) {
      document.getElementById('buttonGroup').style.display = 'none';
      document.getElementById('guideArea').style.display = 'block';
      document.getElementById('guideTitle').textContent = title;
      
      var html = "";
      for (var i = 0; i < steps.length; i++) {
        html += "<p>" + steps[i] + "</p>";
      }
      document.getElementById('guideBody').innerHTML = html;
    }

    function backToChoices() {
      document.getElementById('guideArea').style.display = 'none';
      document.getElementById('buttonGroup').style.display = 'block';
    }

    function closeModal() {
      document.getElementById('installModal').style.display = 'none';
    }

    function openModal() {
      backToChoices();
      document.getElementById('installModal').style.display = 'flex';
    }
  </script>
</body>
</html>
